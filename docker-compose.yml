name: fraudstream

services:

  # ─────────────────────────────────────────────
  # Kafka : journal d'événements (mode KRaft, sans ZooKeeper)
  # ─────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.8.0
    profiles: ["core"]
    hostname: kafka
    ports:
      - "29092:29092"                 # accès depuis Windows (générateur Python)
    environment:
      # --- Identité et rôles (KRaft) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Les deux chemins d'accès + le canal interne du contrôleur ---
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Un seul broker : pas de réplication possible ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # --- Topics et rétention ---
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168  # 7 jours

      # --- Mémoire Java ---
      KAFKA_HEAP_OPTS: "-Xmx512m"
    mem_limit: 1g