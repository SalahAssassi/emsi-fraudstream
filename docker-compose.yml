name: fraudstream

services:

  # ─────────────────────────────────────────────
  # Kafka : journal d'événements (mode KRaft, sans ZooKeeper)
  # ─────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.8.0
    profiles: ["core"]
    hostname: kafka
    ports:
      - "29092:29092"                 # accès depuis Windows (générateur Python)
    environment:
      # --- Identité et rôles (KRaft) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Les deux chemins d'accès + le canal interne du contrôleur ---
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Un seul broker : pas de réplication possible ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # --- Topics et rétention ---
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168  # 7 jours

      # --- Mémoire Java ---
      KAFKA_HEAP_OPTS: "-Xmx512m"
    mem_limit: 1g

  # ─────────────────────────────────────────────
  # PostgreSQL : base source "bank" (clients, cartes) pour le CDC
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16
    profiles: ["core"]
    hostname: postgres
    ports:
      - "5432:5432"                   # accès depuis Windows (seed, tests)
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:                          # réglages indispensables pour Debezium
      - "postgres"
      - "-c"
      - "wal_level=logical"           # journal lisible ligne par ligne (CDC)
      - "-c"
      - "max_wal_senders=4"
      - "-c"
      - "max_replication_slots=4"
    volumes:
      - pg_data:/var/lib/postgresql/data                              # données persistantes
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro  # tables
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data: